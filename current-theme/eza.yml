colourful: true

filekinds:
  normal: {foreground: Default}
  directory: {foreground: "#458588", is_bold: true}
  symlink: {foreground: "#689d6a"}
  pipe: {foreground: "#d79921"}
  block_device: {foreground: "#d79921", is_bold: true}
  char_device: {foreground: "#d79921", is_bold: true}
  socket: {foreground: "#cc241d", is_bold: true}
  special: {foreground: "#d79921"}
  executable: {foreground: "#98971a", is_bold: true}
  mount_point: {foreground: "#458588", is_bold: true, is_underline: true}

perms:
  user_read: {foreground: "#d79921", is_bold: true}
  user_write: {foreground: "#cc241d", is_bold: true}
  user_execute_file: {foreground: "#98971a", is_bold: true, is_underline: true}
  user_execute_other: {foreground: "#98971a", is_bold: true}
  group_read: {foreground: "#d79921"}
  group_write: {foreground: "#cc241d"}
  group_execute: {foreground: "#98971a"}
  other_read: {foreground: "#d79921"}
  other_write: {foreground: "#cc241d"}
  other_execute: {foreground: "#98971a"}
  special_user_file: {foreground: "#b16286"}
  special_other: {foreground: "#b16286"}
  attribute: {foreground: Default}

size:
  major: {foreground: "#98971a", is_bold: true}
  minor: {foreground: "#98971a"}
  number_byte: {foreground: "#98971a"}
  number_kilo: {foreground: "#98971a"}
  number_mega: {foreground: "#b8bb26"}
  number_giga: {foreground: "#fabd2f"}
  number_huge: {foreground: "#fb4934"}
  unit_byte: {foreground: "#928374"}
  unit_kilo: {foreground: "#928374"}
  unit_mega: {foreground: "#928374"}
  unit_giga: {foreground: "#928374"}
  unit_huge: {foreground: "#928374"}

users:
  user_you: {foreground: "#d79921", is_bold: true}
  user_root: {foreground: "#cc241d"}
  user_other: {foreground: Default}
  group_yours: {foreground: "#d79921"}
  group_other: {foreground: Default}
  group_root: {foreground: "#cc241d"}

links:
  normal: {foreground: "#cc241d", is_bold: true}
  multi_link_file: {foreground: "#cc241d", background: "#504945"}

git:
  new: {foreground: "#98971a"}
  modified: {foreground: "#458588"}
  deleted: {foreground: "#cc241d"}
  renamed: {foreground: "#d79921"}
  typechange: {foreground: "#b16286"}
  ignored: {foreground: "#665c54"}
  conflicted: {foreground: "#fb4934"}

git_repo:
  branch_main: {foreground: "#98971a"}
  branch_other: {foreground: "#d79921"}
  git_clean: {foreground: "#98971a"}
  git_dirty: {foreground: "#d79921"}

file_type:
  image: {foreground: "#b16286"}
  video: {foreground: "#d3869b"}
  music: {foreground: "#689d6a"}
  lossless: {foreground: "#8ec07c"}
  crypto: {foreground: "#98971a", is_bold: true}
  document: {foreground: "#ebdbb2"}
  compressed: {foreground: "#cc241d"}
  temp: {foreground: "#665c54"}
  compiled: {foreground: "#d65d0e"}
  build: {foreground: "#d79921", is_bold: true, is_underline: true}
  source: {foreground: "#fabd2f"}

punctuation: {foreground: "#665c54"}
date: {foreground: "#458588"}
inode: {foreground: "#b16286"}
blocks: {foreground: "#689d6a"}
header: {foreground: Default, is_underline: true}
octal: {foreground: "#b16286"}
flags: {foreground: Default}
symlink_path: {foreground: "#689d6a"}
control_char: {foreground: "#cc241d"}
broken_symlink: {foreground: "#cc241d"}
broken_path_overlay: {foreground: Default, is_underline: true}
