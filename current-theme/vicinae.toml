# discOS — generated, don't edit
# Linked into ~/.local/share/vicinae/themes/discos.toml by discos-theme.

[meta]
name = "discOS"
description = "Catppuccin Mocha via discOS"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "#89b4fa"
accent_foreground = "#1e1e2e"
background = "#1e1e2e"
foreground = "#cdd6f4"
secondary_background = "#181825"
border = "#313244"

[colors.main_window]
border = "#313244"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "#313244"

[colors.accents]
blue = "#89b4fa"
green = "#a6e3a1"
magenta = "#cba6f7"
orange = "#fab387"
red = "#f38ba8"
yellow = "#f9e2af"
cyan = "#94e2d5"
purple = "#cba6f7"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "#585b70"
danger = "#f38ba8"
success = "#a6e3a1"
placeholder = "#45475a"
selection = { background = "#89b4fa", foreground = "#1e1e2e" }

[colors.text.links]
default = "#89b4fa"
visited = "#cba6f7"

[colors.input]
border = "#313244"
border_focus = "#89b4fa"
border_error = "#f38ba8"

[colors.button.primary]
background = "#181825"
foreground = "#cdd6f4"
hover = { background = "#313244" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "#cdd6f4"
secondary_foreground = "#cdd6f4"

[colors.list.item.selection]
background = "#313244"
foreground = "#cdd6f4"
secondary_background = "#313244"
secondary_foreground = "#cdd6f4"

[colors.grid.item]
background = "#181825"
hover = { outline = "#cdd6f4" }
selection = { outline = "#cdd6f4" }
